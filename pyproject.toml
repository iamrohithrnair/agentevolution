[project]
name = "dronan"
version = "0.1.0"
description = "Voice-first, memory-augmented multi-agent platform for medical drone logistics"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dronan Team" }]

dependencies = [
  # MongoDB
  "motor>=3.6.0",
  "pymongo[srv,encryption]>=4.10.0",
  # LangChain + LangGraph
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-mongodb>=0.2.0",
  "langchain-voyageai>=0.1.4",
  "langgraph>=0.2.40",
  "langgraph-checkpoint-mongodb>=0.1.0",
  "voyageai>=0.3.0",
  # LLM client
  "openai>=1.50.0",
  # FastAPI + ASGI
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "websockets>=13.0",
  "python-multipart>=0.0.12",
  # Routing & geo
  "ortools>=9.11.4210",
  "shapely>=2.0.6",
  # Models & validation
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  # Voice
  "livekit-agents>=0.11.0",
  "livekit-plugins-deepgram>=0.7.0",
  "livekit-plugins-elevenlabs>=0.7.0",
  "livekit-plugins-silero>=0.7.0",
  # Vision
  "ultralytics>=8.3.0",
  "pillow>=10.4.0",
  # Optional integrations
  "googlemaps>=4.10.0",
  # Utilities
  "python-dotenv>=1.0.1",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "numpy>=2.1.0",
  "httpx>=0.27.2",
  "structlog>=24.4.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-pymongo>=0.48b0",
  "reportlab>=4.2.5",
  "langchain-google-genai>=4.2.2",
]

[project.optional-dependencies]
# airsim and px4 adapters are opt-in; install manually if needed:
#   uv pip install "airsim>=1.8.1" "msgpack-rpc-python" --no-build-isolation
#   uv pip install "pymavlink>=2.4.41"
px4 = ["pymavlink>=2.4.41"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "types-requests",
  "ipython",
  "mongomock-motor>=0.0.36",
]

[tool.uv]
package = true
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/dronan"]

[tool.hatch.build.targets.wheel.sources]
"backend/dronan" = "dronan"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
pythonpath = ["backend"]
markers = [
  "slow: long-running tests (skipped by default in fast iterations)",
  "integration: requires real MongoDB / network",
  "live_llm: requires real OpenAI/Voyage keys",
  "live_voice: requires real LiveKit/Deepgram/ElevenLabs keys",
]
